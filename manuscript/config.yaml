    html: true
    slides: false
    docx: false
    epub: false

# Layout knobs the renderer reads. They live under `rendering:`, not `render:`;
# `render:` carries only the format switches, so a fraction placed there is
# silently ignored (that is how the cover fraction below sat dead for a while).
#
# figure_height_fraction raises the height cap the renderer injects into every
# \includegraphics. At the template default of 0.50 the taller plates are
# scaled down until their in-figure labels fall below 6pt, which breaks the
# "shape and text repeat the meaning" accessibility contract. 0.92 keeps the
# declared width binding for every current figure; the gate in
# tests/test_figure_legibility.py measures the result rather than trusting it.
rendering:
  figure_height_fraction: 0.92
  front_matter_figure_height_fraction: 0.92
  cover_height_fraction: 0.56

metadata:
